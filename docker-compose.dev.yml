version: "3.9"

services:
  postgres:
    image: postgres:15
    container_name: skia_postgres_dev
    environment:
      POSTGRES_USER: skia
      POSTGRES_PASSWORD: skia
      POSTGRES_DB: skia
    ports:
      - "5432:5432"
    volumes:
      - postgres_dev_data:/var/lib/postgresql/data

volumes:
  postgres_dev_data:
