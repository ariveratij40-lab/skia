name: CI Staging Build

on:
  push:
    branches:
      - main

jobs:
  build-and-push-staging:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Login GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GHCR_TOKEN }}

      - name: Build and push API staging
        run: |
          docker build -t ghcr.io/ariveratij40-lab/skia/skia-api:staging ./backend
          docker push ghcr.io/ariveratij40-lab/skia/skia-api:staging

      - name: Build and push WEB staging
        run: |
          docker build -t ghcr.io/ariveratij40-lab/skia/skia-web:staging ./web
          docker push ghcr.io/ariveratij40-lab/skia/skia-web:staging
