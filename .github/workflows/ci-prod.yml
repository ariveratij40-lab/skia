name: CI Prod Deploy (release tag)

on:
  push:
    tags:
      - "release-*"

permissions:
  contents: read
  packages: write

concurrency:
  group: skia-prod
  cancel-in-progress: false

jobs:
  build_and_push:
    name: Build & Push images to GHCR (PROD)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Define TAG
        id: vars
        shell: bash
        run: |
          echo "TAG=${GITHUB_REF_NAME}" >> "$GITHUB_OUTPUT"
          echo "Using tag: ${GITHUB_REF_NAME}"

      - name: Login to GHCR (GITHUB_TOKEN)
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build & Push API
        uses: docker/build-push-action@v6
        with:
          context: ./backend
          file: ./backend/Dockerfile
          push: true
          tags: ghcr.io/ariveratij40-lab/skia/skia-api:${{ steps.vars.outputs.TAG }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build & Push WEB
        uses: docker/build-push-action@v6
        with:
          context: ./web
          file: ./web/Dockerfile
          push: true
          tags: ghcr.io/ariveratij40-lab/skia/skia-web:${{ steps.vars.outputs.TAG }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    name: Deploy to VPS (PROD)
    runs-on: ubuntu-latest
    needs: build_and_push
    environment: prod

    steps:
      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: 22
          script_stop: true
          script: |
            set -euo pipefail

            export SKIA_TAG="${{ github.ref_name }}"
            echo "Deploying SKIA PROD with tag: ${SKIA_TAG}"

            cd /opt/apps/skia/prod

            # ===== Guardrails / Validaciones =====
            test -f compose.prod.yml || { echo "ERROR: compose.prod.yml no existe en /opt/apps/skia/prod"; ls -la; exit 1; }
            test -f .env.prod       || { echo "ERROR: .env.prod no existe en /opt/apps/skia/prod"; ls -la; exit 1; }

            if grep -nR "\.env\.staging" compose.prod.yml; then
              echo "ERROR: compose.prod.yml aún referencia .env.staging (no permitido en PROD)"
              exit 1
            fi

            echo "${{ secrets.GHCR_TOKEN }}" | docker login ghcr.io -u ariveratij40-lab --password-stdin

            echo "== docker compose config (sanity) =="
            docker compose --env-file .env.prod -f compose.prod.yml config | sed -n '1,160p'

            echo "== pull =="
            docker compose --env-file .env.prod -f compose.prod.yml pull

            echo "== up =="
            docker compose --env-file .env.prod -f compose.prod.yml up -d --remove-orphans

            echo "== ps =="
            docker compose --env-file .env.prod -f compose.prod.yml ps

            echo "== prune =="
            docker image prune -f

            echo "== health check =="
            curl -fsS https://skia.iamet.mx/api/health && echo " PROD HEALTH OK"
