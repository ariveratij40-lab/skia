name: CI/CD Staging - SKIA

on:
  push:
    branches: [ "main" ]

env:
  REGISTRY: ghcr.io
  IMAGE_API: ghcr.io/ariveratij40-lab/skia/skia-api
  IMAGE_WEB: ghcr.io/ariveratij40-lab/skia/skia-web

jobs:
  build_push:
    name: Build & Push (api + web)
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Meta (SHA)
        id: meta
        run: echo "SHA_TAG=${GITHUB_SHA}" >> $GITHUB_OUTPUT

      - name: Build & Push skia-api
        uses: docker/build-push-action@v5
        with:
          context: ./backend
          file: ./backend/Dockerfile
          push: true
          tags: |
            ${{ env.IMAGE_API }}:latest
            ${{ env.IMAGE_API }}:${{ steps.meta.outputs.SHA_TAG }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build & Push skia-web
        uses: docker/build-push-action@v5
        with:
          context: ./web
          file: ./web/Dockerfile
          push: true
          tags: |
            ${{ env.IMAGE_WEB }}:latest
            ${{ env.IMAGE_WEB }}:${{ steps.meta.outputs.SHA_TAG }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy_staging:
    name: Deploy to VPS (staging)
    runs-on: ubuntu-latest
    needs: build_push
    if: success()

    steps:
      - name: SSH deploy
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          script: |
            set -e
            cd /opt/skia-staging

            echo "${{ secrets.GHCR_TOKEN }}" | docker login ghcr.io -u ${{ github.actor }} --password-stdin

            # Opcional: deploy inmutable por SHA
            export SKIA_TAG=${{ github.sha }}

            docker compose pull
            docker compose up -d
            docker image prune -f
