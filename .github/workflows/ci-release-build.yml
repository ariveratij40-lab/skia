permissions:
  contents: read
  packages: write

name: CI Release Build

on:
  push:
    tags:
      - 'release-*'

jobs:
  build-and-push-release:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Login GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ariveratij40-lab
          password: ${{ secrets.GHCR_TOKEN }}

      - name: Build and push API release
        run: |
          docker build -t ghcr.io/ariveratij40-lab/skia/skia-api:${{ github.ref_name }} backend
          docker push ghcr.io/ariveratij40-lab/skia/skia-api:${{ github.ref_name }}

      - name: Build and push WEB release
        run: |
          docker build -t ghcr.io/ariveratij40-lab/skia/skia-web:${{ github.ref_name }} web
          docker push ghcr.io/ariveratij40-lab/skia/skia-web:${{ github.ref_name }}
