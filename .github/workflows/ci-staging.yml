name: CI Staging (build -> push -> deploy)

on:
  push:
    tags:
      - "checkpoint-*"
      - "staging-*"

permissions:
  contents: read
  packages: write

env:
  REGISTRY: ghcr.io
  IMAGE_API: ghcr.io/ariveratij40-lab/skia/skia-api
  IMAGE_WEB: ghcr.io/ariveratij40-lab/skia/skia-web

jobs:
  build_and_push:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set tag
        run: echo "TAG=${GITHUB_REF_NAME}" >> $GITHUB_ENV

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build & Push API
        uses: docker/build-push-action@v6
        with:
          context: .
          file: backend/Dockerfile
          push: true
          tags: |
            ghcr.io/ariveratij40-lab/skia/skia-api:${{ env.TAG }}

      - name: Build & Push WEB
        uses: docker/build-push-action@v6
        with:
          context: .
          file: web/Dockerfile
          push: true
          tags: |
            ghcr.io/ariveratij40-lab/skia/skia-web:${{ env.TAG }}

  deploy:
    runs-on: ubuntu-latest
    needs: build_and_push

    steps:
      - name: Deploy to VPS
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: ${{ secrets.VPS_PORT }}
          script_stop: true
          script: |
            set -e

            cd /opt/apps/skia/staging

            echo "${{ secrets.GHCR_TOKEN }}" | docker login ghcr.io -u ariveratij40-lab --password-stdin

            export SKIA_TAG="${{ github.ref_name }}"
            echo "Deploying tag: ${SKIA_TAG}"

            docker compose --env-file .env.staging -f compose.staging.yml pull
            docker compose --env-file .env.staging -f compose.staging.yml up -d --remove-orphans

            docker image prune -f
