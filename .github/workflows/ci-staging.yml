name: CI Staging Deploy (tag)

on:
  push:
    tags:
      - "checkpoint-*"
      - "staging-*"

permissions:
  contents: read
  packages: write

env:
  REGISTRY: ghcr.io
  IMAGE_API: ghcr.io/ariveratij40-lab/skia/skia-api
  IMAGE_WEB: ghcr.io/ariveratij40-lab/skia/skia-web

jobs:
  build_and_push:
    name: Build & Push (api + web)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set TAG from git ref
        id: vars
        run: |
          echo "TAG=${GITHUB_REF_NAME}" >> $GITHUB_OUTPUT
          echo "Using TAG=${GITHUB_REF_NAME}"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # Login a GHCR:
      # Opción 1 (recomendada): usar el GITHUB_TOKEN del repo (permissions.packages:write)
      - name: Login to GHCR (GITHUB_TOKEN)
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Si por alguna razón su org/policy no permite GITHUB_TOKEN para packages,
      # cambie el paso anterior por este, usando su secret GHCR_TOKEN:
      # - name: Login to GHCR (PAT)
      #   uses: docker/login-action@v3
      #   with:
      #     registry: ${{ env.REGISTRY }}
      #     username: ariveratij40-lab
      #     password: ${{ secrets.GHCR_TOKEN }}

      - name: Build & Push API
        uses: docker/build-push-action@v6
        with:
          context: ./backend
          file: ./backend/Dockerfile
          push: true
          tags: |
            ${{ env.IMAGE_API }}:${{ steps.vars.outputs.TAG }}

      - name: Build & Push WEB
        uses: docker/build-push-action@v6
        with:
          context: ./web
          file: ./web/Dockerfile
          push: true
          tags: |
            ${{ env.IMAGE_WEB }}:${{ steps.vars.outputs.TAG }}

  deploy:
    name: Deploy to VPS (staging)
    runs-on: ubuntu-latest
    needs: build_and_push

    steps:
      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: ${{ secrets.VPS_PORT || 22 }}
          script_stop: true
          script: |
            set -euo pipefail

            cd /opt/apps/skia/staging

            # Login en el VPS para poder hacer pull desde GHCR
            echo "${{ secrets.GHCR_TOKEN }}" | docker login ghcr.io -u ariveratij40-lab --password-stdin

            export SKIA_TAG="${GITHUB_REF_NAME}"
            echo "Deploying SKIA STAGING with tag: ${SKIA_TAG}"

            docker compose --env-file .env.staging -f compose.staging.yml pull
            docker compose --env-file .env.staging -f compose.staging.yml up -d --remove-orphans

            docker image prune -f
            docker compose --env-file .env.staging -f compose.staging.yml ps
