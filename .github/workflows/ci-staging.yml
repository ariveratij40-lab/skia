name: CI Staging Deploy (tag)

on:
  push:
    tags:
      - "checkpoint-*"
      - "staging-*"
      - "checkpoint-nocache-*"

permissions:
  contents: read
  packages: write

concurrency:
  group: staging-deploy
  cancel-in-progress: false

jobs:
  build_and_push:
    name: Build & Push images to GHCR
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Define TAG
        id: vars
        shell: bash
        run: |
          echo "TAG=${GITHUB_REF_NAME}" >> "$GITHUB_OUTPUT"
          echo "Using tag: ${GITHUB_REF_NAME}"

          # Si el tag inicia con checkpoint-nocache-, activamos rebuild duro.
          if [[ "${GITHUB_REF_NAME}" == checkpoint-nocache-* ]]; then
            echo "NO_CACHE=true" >> "$GITHUB_OUTPUT"
            echo "No-cache mode: ENABLED"
          else
            echo "NO_CACHE=false" >> "$GITHUB_OUTPUT"
            echo "No-cache mode: disabled"
          fi

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # ===== API (backend) =====
      - name: Build & Push API
        uses: docker/build-push-action@v6
        with:
          context: ./backend
          file: ./backend/Dockerfile
          push: true
          pull: true
          no-cache: ${{ steps.vars.outputs.NO_CACHE }}
          tags: |
            ghcr.io/ariveratij40-lab/skia/skia-api:${{ steps.vars.outputs.TAG }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # ===== WEB =====
      - name: Build & Push WEB
        uses: docker/build-push-action@v6
        with:
          context: ./web
          file: ./web/Dockerfile
          push: true
          pull: true
          no-cache: ${{ steps.vars.outputs.NO_CACHE }}
          tags: |
            ghcr.io/ariveratij40-lab/skia/skia-web:${{ steps.vars.outputs.TAG }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    name: Deploy to VPS (Staging)
    runs-on: ubuntu-latest
    needs: build_and_push

    steps:
      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: ${{ secrets.VPS_PORT || 22 }}
          script_stop: true
          script: |
            set -euo pipefail

            cd /opt/apps/skia/staging

            echo "${{ secrets.GHCR_TOKEN }}" | docker login ghcr.io -u ariveratij40-lab --password-stdin

            export SKIA_TAG="${{ github.ref_name }}"
            echo "Deploying SKIA STAGING with tag: ${SKIA_TAG}"

            echo ">>> Pull images"
            docker compose --env-file .env.staging -f compose.staging.yml pull

            echo ">>> Up (recreate if needed)"
            docker compose --env-file .env.staging -f compose.staging.yml up -d --remove-orphans

            echo ">>> Show running containers"
            docker compose --env-file .env.staging -f compose.staging.yml ps

            echo ">>> Show images in use (skia only)"
            docker ps --format "table {{.Names}}\t{{.Image}}\t{{.Status}}" | grep -E "skia_(api|web)_(staging|prod)" || true

            echo ">>> Prune dangling images"
            docker image prune -f
