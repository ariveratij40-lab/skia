# /opt/skia-staging/docker-compose.staging.yml
# (staging) SKIA - usa tag dinámico con fallback a latest

services:
  skia_api_staging:
    image: ghcr.io/ariveratij40-lab/skia/skia-api:${SKIA_TAG:-latest}
    container_name: skia_api_staging
    restart: unless-stopped
    env_file:
      - .env.staging
    networks:
      - infra_network
    ports:
      - "8080:8080"

  skia_web_staging:
    image: ghcr.io/ariveratij40-lab/skia/skia-web:${SKIA_TAG:-latest}
    container_name: skia_web_staging
    restart: unless-stopped
    env_file:
      - .env.staging
    networks:
      - infra_network
    ports:
      - "3000:3000"

networks:
  infra_network:
    external: true
    name: infra_network
