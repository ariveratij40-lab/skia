name: CI/CD Staging - SKIA (tag -> build+push -> deploy)

on:
  push:
    tags:
      - "checkpoint-*"
      - "staging-*"

permissions:
  contents: read
  packages: write

env:
  REGISTRY: ghcr.io
  IMAGE_API: ghcr.io/ariveratij40-lab/skia/skia-api
  IMAGE_WEB: ghcr.io/ariveratij40-lab/skia/skia-web

jobs:
  build_and_push:
    name: Build & Push (api + web)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
      - uses: actions/checkout@v4

      - name: Set tag
        id: vars
        run: |
          echo "TAG=${GITHUB_REF_NAME}" >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ariveratij40-lab
          password: ${{ secrets.GHCR_TOKEN }}

      # --- API ---
      - name: Build & Push API
        uses: docker/build-push-action@v6
        with:
          context: .
          file: backend/Dockerfile
          push: true
          tags: |
            ${{ env.IMAGE_API }}:${{ steps.vars.outputs.TAG }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # --- WEB ---
      - name: Build & Push WEB
        uses: docker/build-push-action@v6
        with:
          context: .
          file: web/Dockerfile
          push: true
          tags: |
            ${{ env.IMAGE_WEB }}:${{ steps.vars.outputs.TAG }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy_staging:
    name: Deploy to VPS (staging)
    runs-on: ubuntu-latest
    needs: build_and_push

    steps:
      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          # Si su VPS usa puerto 22, deje esta línea tal cual o bórrala.
          port: ${{ secrets.VPS_PORT || 22 }}
          script_stop: true
          script: |
            set -euo pipefail

            cd /opt/apps/skia/staging

            echo "${{ secrets.GHCR_TOKEN }}" | docker login ghcr.io -u ariveratij40-lab --password-stdin

            export SKIA_TAG="${GITHUB_REF_NAME}"
            echo "Deploying STAGING with SKIA_TAG=${SKIA_TAG}"

            docker compose --env-file .env.staging -f compose.staging.yml pull
            docker compose --env-file .env.staging -f compose.staging.yml up -d --remove-orphans

            docker image prune -f

            docker compose --env-file .env.staging -f compose.staging.yml ps
