name: CI Staging Deploy

on:
  push:
    branches:
      - main

jobs:
  deploy-staging:
    runs-on: ubuntu-latest

    steps:
      - name: Deploy to VPS staging
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          script_stop: true
          script: |
            set -euo pipefail

            echo "Starting STAGING deploy"

            cd /opt/apps/skia/staging

            test -f docker-compose.yml || { echo "docker-compose.yml missing"; exit 1; }

            echo "${{ secrets.GHCR_TOKEN }}" | docker login ghcr.io -u ariveratij40-lab --password-stdin

            docker compose pull
            docker compose up -d --remove-orphans
            docker compose ps

            curl -kIs https://staging.skia.iamet.mx/ || true

            docker image prune -f
