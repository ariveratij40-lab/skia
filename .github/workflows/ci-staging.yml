name: SKIA - CI & Deploy STAGING

on:
  push:
    branches:
      - develop
  workflow_dispatch:

permissions:
  contents: read
  packages: read

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      # 1️⃣ Checkout
      - name: Checkout repository
        uses: actions/checkout@v4

      # 2️⃣ Login to GHCR (para pull de imágenes privadas si aplica)
      - name: Login to GHCR
        run: echo "${{ secrets.GHCR_TOKEN }}" | docker login ghcr.io -u ariveratij40-lab --password-stdin

      # 3️⃣ Deploy via SSH
      - name: Deploy to VPS (STAGING)
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          script_stop: true
          command_timeout: 30m
          script: |
            set -euo pipefail

            echo "=============================="
            echo "SKIA STAGING DEPLOY START"
            echo "=============================="

            APP_DIR="/opt/apps/skia/staging"
            ENV_FILE=".env.staging"
            COMPOSE_FILE="compose.staging.yml"
            HEALTH_URL="https://staging.skia.iamet.mx/api/health"

            echo "==> Moving to ${APP_DIR}"
            cd ${APP_DIR}

            echo "==> Docker login GHCR"
            echo "${{ secrets.GHCR_TOKEN }}" | docker login ghcr.io -u ariveratij40-lab --password-stdin

            echo "==> Pulling latest images"
            docker compose --env-file ${ENV_FILE} -f ${COMPOSE_FILE} pull

            echo "==> Restarting containers"
            docker compose --env-file ${ENV_FILE} -f ${COMPOSE_FILE} up -d

            echo "==> Cleaning unused images"
            docker image prune -f

            echo "==> Verifying health endpoint"
            curl -fsS ${HEALTH_URL}

            echo ""
            echo "=============================="
            echo "STAGING DEPLOY SUCCESS"
            echo "=============================="
