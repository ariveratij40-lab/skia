# SKIA - Docker Compose
# Infraestructura para Sistema de Gestión de Infraestructura Física
# 
# DIRECTIVA TÉCNICA:
# - NO incluir PostgreSQL (usar global_postgres_db existente)
# - NO incluir nginx (usar nginx existente)
# - Usar red externa: infra_network

version: '3.8'

services:
  skia-api:
    image: ghcr.io/ariveratij40-lab/skia/skia-api:${SKIA_TAG:-latest}
    container_name: skia-api
    restart: always
    networks:
      - infra_network
    environment:
      - ENV=staging
      - GIN_MODE=release
      - DATABASE_URL=${DATABASE_URL}
      - JWT_SECRET=${JWT_SECRET}
    ports:
      - "8080:8080"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8080/health"]
      interval: 15s
      timeout: 5s
      retries: 10

  skia-web:
    image: ghcr.io/ariveratij40-lab/skia/skia-web:${SKIA_TAG:-latest}
    container_name: skia-web
    restart: always
    networks:
      - infra_network
    environment:
      - NODE_ENV=production
      - NEXT_PUBLIC_API_BASE_URL=${NEXT_PUBLIC_API_BASE_URL}
    ports:
      - "3000:3000"

networks:
  infra_network:
    external: true
