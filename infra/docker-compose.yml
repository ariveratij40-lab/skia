# SKIA - Docker Compose
# Infraestructura para Sistema de Gestión de Infraestructura Física
# 
# DIRECTIVA TÉCNICA:
# - NO incluir PostgreSQL (usar global_postgres_db existente)
# - NO incluir nginx (usar nginx existente)
# - Usar red externa: infra_network

version: '3.8'

services:
  # Backend API
  skia-backend:
    build:
      context: ../backend
      dockerfile: Dockerfile
    container_name: skia-backend
    restart: unless-stopped
    environment:
      - APP_ENV=${APP_ENV:-production}
      - APP_PORT=${APP_PORT:-8080}
      - DATABASE_URL=${DATABASE_URL}
      - JWT_SECRET=${JWT_SECRET}
      - JWT_EXPIRATION=${JWT_EXPIRATION:-15m}
      - JWT_REFRESH_EXPIRATION=${JWT_REFRESH_EXPIRATION:-7d}
      - LOG_LEVEL=${LOG_LEVEL:-info}
    ports:
      - "8080:8080"
    networks:
      - infra_network
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:8080/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  # Frontend Web
  skia-web:
    build:
      context: ../web
      dockerfile: Dockerfile
    container_name: skia-web
    restart: unless-stopped
    environment:
      - NODE_ENV=${NODE_ENV:-production}
      - NEXT_PUBLIC_API_URL=${NEXT_PUBLIC_API_URL:-http://localhost:8080/v1}
    ports:
      - "3000:3000"
    networks:
      - infra_network
    depends_on:
      - skia-backend
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:3000"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

# Red externa (existente en VPS)
networks:
  infra_network:
    external: true
